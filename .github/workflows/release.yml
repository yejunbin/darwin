name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            bundle-platform: 'macos-arm64'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            bundle-platform: 'macos-x64'
          - platform: 'ubuntu-22.04'
            args: '--bundles deb'
            bundle-platform: 'linux-x64'
          - platform: 'windows-latest'
            args: ''
            bundle-platform: 'win-x64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        run: rustup update stable

      - name: Install Rust target (macOS x86_64 only)
        if: matrix.bundle-platform == 'macos-x64'
        run: rustup target add x86_64-apple-darwin

      - name: Install dependencies (ubuntu only)
        if: matrix.bundle-platform == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            desktop/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json', 'desktop/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd desktop && npm install

      - name: Prepare Darwin desktop bundle
        shell: bash
        run: node scripts/prepare-desktop-bundle.mjs --platform=${{ matrix.bundle-platform }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Darwin ${{ github.ref_name }}'
          releaseBody: 'See the assets to download and install this version.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
